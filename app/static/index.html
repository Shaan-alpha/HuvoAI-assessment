<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northstar Homes — AI Sales Agent</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #14181f;
    --muted: #6b7280;
    --line: #e4e7ec;
    --brand: #1c3f72;
    --brand-soft: #eef3fa;
    --voice: #a3421c;
    --voice-soft: #fbeee8;
    --ok: #1a7f52;
    --warn: #a3421c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 40px; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .project { color: var(--muted); font-size: 13px; }
  .facts { color: var(--muted); font-size: 12.5px; margin: 6px 0 20px; }

  .cols { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }

  .bar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .badge {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    padding: 4px 9px; border-radius: 5px;
    background: var(--brand-soft); color: var(--brand);
  }
  .badge.voice { background: var(--voice-soft); color: var(--voice); }
  .bar .spacer { flex: 1; }

  button {
    font: inherit; font-size: 13px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 7px 13px; border-radius: 7px;
  }
  button:hover { border-color: #c9ced8; }
  button.on { background: var(--voice); border-color: var(--voice); color: #fff; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button:disabled { opacity: 0.5; cursor: default; }

  #log { height: 460px; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 13px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #f1f3f6; border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; background: transparent; color: var(--muted); font-size: 12.5px; font-style: italic; }
  .dots { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 6px 4px; }

  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  .composer input {
    flex: 1; font: inherit; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  .composer input:focus { border-color: var(--brand); }

  .side h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0; }
  .side .body { padding: 16px; }
  .empty { color: var(--muted); font-size: 13px; }

  .score { display: flex; align-items: baseline; gap: 8px; margin: 4px 0 14px; }
  .score b { font-size: 30px; letter-spacing: -0.02em; }
  .pill { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 20px; text-transform: uppercase; }
  .pill.hot { background: #fdeceb; color: #b3261e; }
  .pill.warm { background: #fdf1e3; color: #92500f; }
  .pill.cold { background: #eef1f5; color: #4a5568; }
  .pill.unknown { background: #eef1f5; color: #6b7280; }

  dl { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 9px 10px; font-size: 13px; }
  dl.wide { grid-template-columns: 1fr; }
  dt { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  dd { margin: 1px 0 0; }
  .flag { margin-top: 14px; padding: 9px 11px; border-radius: 7px; font-size: 13px; font-weight: 600; }
  .flag.dnc { background: #fdeceb; color: #b3261e; }
  .flag.esc { background: #fdf1e3; color: #92500f; }
  ul.plain { margin: 3px 0 0; padding-left: 17px; font-size: 13px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Northstar Homes</h1>
    <span class="project">Northstar One &middot; Sector 79, Gurugram</span>
  </header>
  <p class="facts">2 BHK from &#8377;1.35 crore &middot; 3 BHK from &#8377;1.75 crore</p>

  <div class="cols">
    <div class="panel">
      <div class="bar">
        <span id="badge" class="badge">CHAT</span>
        <span class="spacer"></span>
        <button id="voiceBtn" hidden>Voice mode</button>
        <button id="analyseBtn">End &amp; analyse</button>
        <button id="resetBtn">Reset</button>
      </div>
      <div id="log"></div>
      <form class="composer" id="composer">
        <input id="input" autocomplete="off" placeholder="Type in English, Hindi or Hinglish…">
        <button class="primary" type="submit" id="sendBtn">Send</button>
      </form>
    </div>

    <div class="panel side">
      <div class="bar"><h2>Lead analytics</h2></div>
      <div class="body" id="analytics">
        <p class="empty">Have a conversation, then choose <b>End &amp; analyse</b> to extract the lead record.</p>
      </div>
    </div>
  </div>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const badge = document.getElementById('badge');
const voiceBtn = document.getElementById('voiceBtn');
const sendBtn = document.getElementById('sendBtn');

let sessionId = null;
let voiceMode = false;
let busy = false;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canSpeak = 'speechSynthesis' in window;
if (SR || canSpeak) voiceBtn.hidden = false;

function add(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function isDevanagari(s) { return /[ऀ-ॿ]/.test(s); }

function speak(text) {
  if (!voiceMode || !canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = isDevanagari(text) ? 'hi-IN' : 'en-IN';
  u.rate = 1.05;
  speechSynthesis.speak(u);
}

async function send(text) {
  if (busy) return;
  busy = true; sendBtn.disabled = true;
  add('user', text);

  const dots = document.createElement('div');
  dots.className = 'dots';
  dots.textContent = 'Priya is typing…';
  log.appendChild(dots);
  log.scrollTop = log.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        session_id: sessionId,
        channel: voiceMode ? 'voice' : 'chat',
      }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    sessionId = data.session_id;
    dots.remove();
    add('bot', data.reply);
    speak(data.reply);
  } catch (e) {
    dots.remove();
    add('sys', 'Could not reach the agent — ' + e.message);
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
  }
}

document.getElementById('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send(text);
});

// Voice mode does more than open the microphone: it flips the channel sent to
// the backend, which swaps the prompt delta. Same core prompt, different
// rendering — shorter turns, no markdown, prices spoken as words.
voiceBtn.addEventListener('click', () => {
  voiceMode = !voiceMode;
  voiceBtn.classList.toggle('on', voiceMode);
  voiceBtn.textContent = voiceMode ? 'Voice mode: on' : 'Voice mode';
  badge.textContent = voiceMode ? 'VOICE' : 'CHAT';
  badge.classList.toggle('voice', voiceMode);
  input.placeholder = voiceMode
    ? 'Speak, or type — replies are read aloud…'
    : 'Type in English, Hindi or Hinglish…';
  add('sys', voiceMode
    ? 'Voice mode on — the agent now uses the voice channel prompt.'
    : 'Voice mode off — back to the chat channel prompt.');
  if (!voiceMode) { speechSynthesis.cancel(); stopListening(); }
  else startListening();
});

let recogniser = null;
function startListening() {
  if (!SR) return;
  recogniser = new SR();
  recogniser.lang = 'en-IN';
  recogniser.interimResults = false;
  recogniser.continuous = false;
  recogniser.onresult = (e) => {
    const said = e.results[0][0].transcript.trim();
    if (said) send(said);
  };
  recogniser.onend = () => { if (voiceMode) { try { recogniser.start(); } catch (_) {} } };
  try { recogniser.start(); } catch (_) {}
}
function stopListening() {
  if (recogniser) { recogniser.onend = null; recogniser.stop(); recogniser = null; }
}

document.getElementById('resetBtn').addEventListener('click', async () => {
  if (sessionId) await fetch('/api/reset/' + sessionId, { method: 'POST' });
  sessionId = null;
  log.innerHTML = '';
  document.getElementById('analytics').innerHTML =
    '<p class="empty">Have a conversation, then choose <b>End &amp; analyse</b> to extract the lead record.</p>';
  speechSynthesis.cancel();
});

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const show = (v) => (v === null || v === undefined || v === '' ? '&mdash;' : esc(v));

document.getElementById('analyseBtn').addEventListener('click', async () => {
  if (!sessionId) return;
  const box = document.getElementById('analytics');
  box.innerHTML = '<p class="empty">Extracting…</p>';
  try {
    const res = await fetch('/api/analytics/' + sessionId, { method: 'POST' });
    const a = await res.json();
    const budget = a.budget_was_stated && (a.budget_min || a.budget_max)
      ? [a.budget_min, a.budget_max].filter(Boolean).join('–') + ' cr'
      : (a.budget_min || a.budget_max ? 'inferred, not stated' : null);

    box.innerHTML = `
      <div class="score">
        <b>${a.qualification_score ?? 0}</b>
        <span class="pill ${esc(a.interest_level || 'unknown')}">${show(a.interest_level)}</span>
      </div>
      ${a.do_not_contact ? '<div class="flag dnc">DO NOT CONTACT — suppress this lead</div>' : ''}
      ${a.escalation_requested ? '<div class="flag esc">Human escalation requested</div>' : ''}
      <hr>
      <dl>
        <div><dt>Name</dt><dd>${show(a.name)}</dd></div>
        <div><dt>Phone</dt><dd>${show(a.phone)}</dd></div>
        <div><dt>Configuration</dt><dd>${show(a.configuration_interest)}</dd></div>
        <div><dt>Budget</dt><dd>${show(budget)}</dd></div>
        <div><dt>Purpose</dt><dd>${show(a.purpose)}</dd></div>
        <div><dt>Timeline</dt><dd>${show(a.timeline)}</dd></div>
        <div><dt>Possession</dt><dd>${show(a.possession_preference)}</dd></div>
        <div><dt>Home loan</dt><dd>${a.loan_required === null ? '&mdash;' : (a.loan_required ? 'Yes' : 'No')}</dd></div>
        <div><dt>Location</dt><dd>${show(a.preferred_location)}</dd></div>
        <div><dt>Language</dt><dd>${show(a.language_preference)}</dd></div>
        <div><dt>Site visit</dt><dd>${show(a.site_visit_status)}</dd></div>
        <div><dt>Booked for</dt><dd>${show(a.booking_datetime)}</dd></div>
        <div><dt>Follow-up</dt><dd>${a.follow_up_required ? 'Yes' : 'No'}</dd></div>
        <div><dt>Callback</dt><dd>${show(a.callback_time)}</dd></div>
      </dl>
      <hr>
      <dl class="wide">
        <div><dt>Next action</dt><dd>${show(a.next_action)}</dd></div>
        ${a.objections_raised?.length ? `<div><dt>Objections</dt><dd><ul class="plain">${a.objections_raised.map((o) => '<li>' + esc(o) + '</li>').join('')}</ul></dd></div>` : ''}
        ${a.unknown_questions_asked?.length ? `<div><dt>Couldn't answer</dt><dd><ul class="plain">${a.unknown_questions_asked.map((q) => '<li>' + esc(q) + '</li>').join('')}</ul></dd></div>` : ''}
        <div><dt>Summary</dt><dd>${show(a.summary)}</dd></div>
      </dl>`;
  } catch (e) {
    box.innerHTML = '<p class="empty">Extraction failed — ' + esc(e.message) + '</p>';
  }
});

input.focus();
</script>
</body>
</html>
