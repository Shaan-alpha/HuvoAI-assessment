[project]
name = "northstar-agent"
version = "0.1.0"
description = "AI sales agent for Northstar Homes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-genai>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live suite costs about fifteen minutes and a day's free-tier quota, so it
# is opt-in rather than opt-out. `-m live` on the command line overrides this.
addopts = "-m 'not live'"
markers = [
    "live: drives the real Gemini API; deselected unless you ask for it",
]

[tool.uv]
package = false
